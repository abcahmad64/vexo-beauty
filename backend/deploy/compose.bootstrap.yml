services:
  migration:
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
    image: vexo-backend-tools:35a
    env_file:
      - ../.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    restart: "no"
