<svg
      xmlns="http://www.w3.org/2000/svg"
      width="1200"
      height="1400"
      viewBox="0 0 1024 1200"
      role="img"
      aria-labelledby="title description"
    >
      <title id="title">VEXO NOIR</title>
      <desc id="description">
        تصویر استودیویی محصول VEXO NOIR
      </desc>

      <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#050506" />
          <stop offset=".55" stop-color="#10070b" />
          <stop offset="1" stop-color="#020203" />
        </linearGradient>

        <radialGradient id="halo">
          <stop offset="0" stop-color="#9d3558"
                stop-opacity=".48" />
          <stop offset=".45" stop-color="#390b20"
                stop-opacity=".22" />
          <stop offset="1" stop-color="#000"
                stop-opacity="0" />
        </radialGradient>

        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9d3558"
                stop-opacity=".92" />
          <stop offset=".38" stop-color="#390b20" />
          <stop offset=".72" stop-color="#240812" />
          <stop offset="1" stop-color="#090306" />
        </linearGradient>

        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f5c4d1" />
          <stop offset=".3" stop-color="#9d3558" />
          <stop offset=".65" stop-color="#4b1427" />
          <stop offset="1" stop-color="#e99caf" />
        </linearGradient>

        <linearGradient id="glassTop" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff"
                stop-opacity=".38" />
          <stop offset=".35" stop-color="#9d3558"
                stop-opacity=".64" />
          <stop offset="1" stop-color="#1d0710"
                stop-opacity=".82" />
        </linearGradient>

        <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd7e1"
                stop-opacity=".5" />
          <stop offset="1" stop-color="#9d3558"
                stop-opacity=".08" />
        </linearGradient>

        <filter id="blur">
          <feGaussianBlur stdDeviation="34" />
        </filter>

        <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
          <feDropShadow
            dx="0"
            dy="34"
            stdDeviation="28"
            flood-color="#000"
            flood-opacity=".78"
          />
        </filter>
      </defs>

      <rect width="1024" height="1200" fill="url(#background)" />

      <circle
        cx="470"
        cy="425"
        r="430"
        fill="url(#halo)"
        filter="url(#blur)"
      />

      <circle
        cx="512"
        cy="500"
        r="330"
        fill="none"
        stroke="#9d3558"
        stroke-opacity=".22"
        stroke-width="2"
      />

      <circle
        cx="512"
        cy="500"
        r="260"
        fill="none"
        stroke="#ffffff"
        stroke-opacity=".065"
        stroke-width="2"
      />

      <g filter="url(#shadow)">

        <g transform="translate(0 0)">
          <rect x="405" y="188" width="214" height="100"
                rx="14" fill="url(#metal)" />
          <rect x="468" y="280" width="88" height="80"
                rx="8" fill="url(#glassTop)" />
          <path d="M355 410 L424 348 H600 L669 410
                   L632 790 H392 Z"
                fill="url(#body)" stroke="url(#stroke)"
                stroke-width="3" />
          <path d="M424 348 L512 790 L600 348
                   M355 410 L632 790
                   M669 410 L392 790"
                fill="none" stroke="#ffffff"
                stroke-opacity=".075" stroke-width="3" />
        </g>

      </g>

      <text
        x="512"
        y="555"
        text-anchor="middle"
        fill="#fff5f7"
        font-family="Arial, sans-serif"
        font-size="31"
        letter-spacing="8"
      >VEXO NOIR</text>

      <text
        x="512"
        y="597"
        text-anchor="middle"
        fill="#f5bac9"
        fill-opacity=".75"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="6"
      >EAU DE PARFUM</text>

      <ellipse
        cx="512"
        cy="885"
        rx="265"
        ry="52"
        fill="#000"
        fill-opacity=".6"
        filter="url(#blur)"
      />

      <text
        x="74"
        y="1110"
        fill="#f4c4d0"
        font-family="Arial, sans-serif"
        font-size="15"
        letter-spacing="5"
      >VEXO BEAUTY</text>

      <text
        x="950"
        y="1110"
        text-anchor="end"
        fill="#ffffff"
        fill-opacity=".34"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
      >SELECTED CARE</text>
    </svg>
