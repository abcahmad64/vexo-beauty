<svg
      xmlns="http://www.w3.org/2000/svg"
      width="1200"
      height="1400"
      viewBox="0 0 1024 1200"
      role="img"
      aria-labelledby="title description"
    >
      <title id="title">VEXO RADIANCE</title>
      <desc id="description">
        تصویر استودیویی محصول VEXO RADIANCE
      </desc>

      <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#050506" />
          <stop offset=".55" stop-color="#10070b" />
          <stop offset="1" stop-color="#020203" />
        </linearGradient>

        <radialGradient id="halo">
          <stop offset="0" stop-color="#c85c7c"
                stop-opacity=".48" />
          <stop offset=".45" stop-color="#6e1738"
                stop-opacity=".22" />
          <stop offset="1" stop-color="#000"
                stop-opacity="0" />
        </radialGradient>

        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c85c7c"
                stop-opacity=".92" />
          <stop offset=".38" stop-color="#6e1738" />
          <stop offset=".72" stop-color="#240812" />
          <stop offset="1" stop-color="#090306" />
        </linearGradient>

        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f5c4d1" />
          <stop offset=".3" stop-color="#c85c7c" />
          <stop offset=".65" stop-color="#4b1427" />
          <stop offset="1" stop-color="#e99caf" />
        </linearGradient>

        <linearGradient id="glassTop" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff"
                stop-opacity=".38" />
          <stop offset=".35" stop-color="#c85c7c"
                stop-opacity=".64" />
          <stop offset="1" stop-color="#1d0710"
                stop-opacity=".82" />
        </linearGradient>

        <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd7e1"
                stop-opacity=".5" />
          <stop offset="1" stop-color="#c85c7c"
                stop-opacity=".08" />
        </linearGradient>

        <filter id="blur">
          <feGaussianBlur stdDeviation="34" />
        </filter>

        <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
          <feDropShadow
            dx="0"
            dy="34"
            stdDeviation="28"
            flood-color="#000"
            flood-opacity=".78"
          />
        </filter>
      </defs>

      <rect width="1024" height="1200" fill="url(#background)" />

      <circle
        cx="565"
        cy="470"
        r="430"
        fill="url(#halo)"
        filter="url(#blur)"
      />

      <circle
        cx="512"
        cy="500"
        r="330"
        fill="none"
        stroke="#c85c7c"
        stroke-opacity=".22"
        stroke-width="2"
      />

      <circle
        cx="512"
        cy="500"
        r="260"
        fill="none"
        stroke="#ffffff"
        stroke-opacity=".065"
        stroke-width="2"
      />

      <g filter="url(#shadow)">

        <g transform="translate(18 0)">
          <rect x="405" y="195" width="214" height="95"
                rx="28" fill="url(#metal)" />
          <rect x="455" y="275" width="114" height="105"
                rx="24" fill="url(#glassTop)" />
          <path d="M420 365 Q410 365 405 390
                   L370 750 Q368 790 410 804
                   Q512 838 614 804
                   Q656 790 654 750
                   L619 390 Q614 365 604 365 Z"
                fill="url(#body)" stroke="url(#stroke)"
                stroke-width="3" />
          <path d="M438 435 Q512 398 586 435"
                fill="none" stroke="#ffffff"
                stroke-opacity=".13" stroke-width="4" />
        </g>

      </g>

      <text
        x="512"
        y="555"
        text-anchor="middle"
        fill="#fff5f7"
        font-family="Arial, sans-serif"
        font-size="31"
        letter-spacing="8"
      >VEXO RADIANCE</text>

      <text
        x="512"
        y="597"
        text-anchor="middle"
        fill="#f5bac9"
        fill-opacity=".75"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="6"
      >SERUM</text>

      <ellipse
        cx="512"
        cy="885"
        rx="265"
        ry="52"
        fill="#000"
        fill-opacity=".6"
        filter="url(#blur)"
      />

      <text
        x="74"
        y="1110"
        fill="#f4c4d0"
        font-family="Arial, sans-serif"
        font-size="15"
        letter-spacing="5"
      >VEXO BEAUTY</text>

      <text
        x="950"
        y="1110"
        text-anchor="end"
        fill="#ffffff"
        fill-opacity=".34"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
      >SELECTED CARE</text>
    </svg>
