<svg
      xmlns="http://www.w3.org/2000/svg"
      width="1200"
      height="1400"
      viewBox="0 0 1024 1200"
      role="img"
      aria-labelledby="title description"
    >
      <title id="title">VEXO DAILY</title>
      <desc id="description">
        تصویر استودیویی محصول VEXO DAILY
      </desc>

      <defs>
        <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#050506" />
          <stop offset=".55" stop-color="#10070b" />
          <stop offset="1" stop-color="#020203" />
        </linearGradient>

        <radialGradient id="halo">
          <stop offset="0" stop-color="#dc829b"
                stop-opacity=".48" />
          <stop offset=".45" stop-color="#70243d"
                stop-opacity=".22" />
          <stop offset="1" stop-color="#000"
                stop-opacity="0" />
        </radialGradient>

        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#dc829b"
                stop-opacity=".92" />
          <stop offset=".38" stop-color="#70243d" />
          <stop offset=".72" stop-color="#240812" />
          <stop offset="1" stop-color="#090306" />
        </linearGradient>

        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f5c4d1" />
          <stop offset=".3" stop-color="#dc829b" />
          <stop offset=".65" stop-color="#4b1427" />
          <stop offset="1" stop-color="#e99caf" />
        </linearGradient>

        <linearGradient id="glassTop" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff"
                stop-opacity=".38" />
          <stop offset=".35" stop-color="#dc829b"
                stop-opacity=".64" />
          <stop offset="1" stop-color="#1d0710"
                stop-opacity=".82" />
        </linearGradient>

        <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffd7e1"
                stop-opacity=".5" />
          <stop offset="1" stop-color="#dc829b"
                stop-opacity=".08" />
        </linearGradient>

        <filter id="blur">
          <feGaussianBlur stdDeviation="34" />
        </filter>

        <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
          <feDropShadow
            dx="0"
            dy="34"
            stdDeviation="28"
            flood-color="#000"
            flood-opacity=".78"
          />
        </filter>
      </defs>

      <rect width="1024" height="1200" fill="url(#background)" />

      <circle
        cx="470"
        cy="425"
        r="430"
        fill="url(#halo)"
        filter="url(#blur)"
      />

      <circle
        cx="512"
        cy="500"
        r="330"
        fill="none"
        stroke="#dc829b"
        stroke-opacity=".22"
        stroke-width="2"
      />

      <circle
        cx="512"
        cy="500"
        r="260"
        fill="none"
        stroke="#ffffff"
        stroke-opacity=".065"
        stroke-width="2"
      />

      <g filter="url(#shadow)">

        <g transform="translate(0 0)">
          <ellipse cx="512" cy="302" rx="196" ry="64"
                   fill="url(#metal)" />
          <rect x="316" y="300" width="392" height="110"
                rx="34" fill="url(#metal)" />
          <ellipse cx="512" cy="407" rx="196" ry="58"
                   fill="#491326" fill-opacity=".72" />
          <path d="M336 403
                   C345 365 679 365 688 403
                   L658 730
                   C650 800 374 800 366 730 Z"
                fill="url(#body)" stroke="url(#stroke)"
                stroke-width="3" />
          <ellipse cx="512" cy="714" rx="146" ry="39"
                   fill="#17070d" fill-opacity=".6" />
        </g>

      </g>

      <text
        x="512"
        y="555"
        text-anchor="middle"
        fill="#fff5f7"
        font-family="Arial, sans-serif"
        font-size="31"
        letter-spacing="8"
      >VEXO DAILY</text>

      <text
        x="512"
        y="597"
        text-anchor="middle"
        fill="#f5bac9"
        fill-opacity=".75"
        font-family="Arial, sans-serif"
        font-size="14"
        letter-spacing="6"
      >MOISTURIZER</text>

      <ellipse
        cx="512"
        cy="885"
        rx="265"
        ry="52"
        fill="#000"
        fill-opacity=".6"
        filter="url(#blur)"
      />

      <text
        x="74"
        y="1110"
        fill="#f4c4d0"
        font-family="Arial, sans-serif"
        font-size="15"
        letter-spacing="5"
      >VEXO BEAUTY</text>

      <text
        x="950"
        y="1110"
        text-anchor="end"
        fill="#ffffff"
        fill-opacity=".34"
        font-family="Arial, sans-serif"
        font-size="12"
        letter-spacing="3"
      >SELECTED CARE</text>
    </svg>
